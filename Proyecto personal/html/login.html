<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Tienda de Relojes</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <div class="background-blur"></div>

    <div class="login-card">
        <img src="../images/pngegg.png" alt="Logo">

        <div id="timer" style="font-size: small; text-align: center; margin-bottom: 10px;">0 seconds</div>

        <form onsubmit="location.href='index.html'; return false;">
            <input type="text" placeholder="Usuario" required>
            <input type="password" placeholder="Contraseña" required>
            <button type="submit">ENTRAR</button>
        </form>
    </div>

    <script>
        let seconds = 0;
        setInterval(() => {
            seconds++;
            document.getElementById('timer').textContent = seconds + ' seconds';
        }, 1000);
    </script>
